__patch:
  - patch:
      menu:
        alternative_select_keys: "0123456789"	#重碼選擇鍵，從 0 開始
        page_size: 5	#選單每頁個數（嘸蝦米／注音／拼音／英文只改這裡）
      ascii_composer:
        good_old_caps_lock: true
        switch_key: {Caps_Lock: clear, Control_L: noop, Control_R: noop, Eisu_toggle: clear, Shift_L: commit_code, Shift_R: commit_code}
      switcher/hotkeys:
        - Control+grave
        - Control+Shift+grave

  # 每條獨立一則 patch，才能四次都插入清單最前（同一 map 重複鍵會只留最後一條）
  - patch:
      "key_binder/bindings/@before 0": { accept: period, send: period, when: paging }
  - patch:
      "key_binder/bindings/@before 0": { accept: period, send: period, when: has_menu }
  - patch:
      "key_binder/bindings/@before 0": { accept: comma, send: comma, when: paging }
  - patch:
      "key_binder/bindings/@before 0": { accept: comma, send: comma, when: has_menu }

  - patch/+:
      schema_list:
        - schema: liur
        - schema: liu_bpmf
          name: "注音輸入法"
        - schema: liu_pinyin
          name: "拼音輸入法"
        - schema: easy_en
      switcher/fix_schema_list_order: true
  - patch/key_binder/bindings/+:
    # 絕對跳轉（任一方案按此鍵都到指定方案）
    # ' 族＝蝦／注；; 族＝英／拼；/＝查碼
    - { when: always, accept: "Control+apostrophe", select: liur }           # Ctrl+'  → 嘸蝦米
    # 注音：Ctrl+Shift+' —— Shift 會把 ' 變成 "，鼠鬚管／小狼毫送法不同，故全綁
    - { when: always, accept: "Control+Shift+apostrophe", select: liu_bpmf }
    - { when: always, accept: "Control+Shift+quotedbl", select: liu_bpmf }
    - { when: always, accept: "Control+quotedbl", select: liu_bpmf }
    - { when: always, accept: "Control+Alt+apostrophe", select: liu_bpmf }   # Ctrl+Alt+' 替代
    - { when: always, accept: "Control+semicolon", select: easy_en }         # Ctrl+;  → Easy English
    # 拼音：Ctrl+Shift+; —— Shift 會把 ; 變成 :
    - { when: always, accept: "Control+Shift+semicolon", select: liu_pinyin }
    - { when: always, accept: "Control+Shift+colon", select: liu_pinyin }
    - { when: always, accept: "Control+colon", select: liu_pinyin }
    - { when: always, accept: "Control+Alt+semicolon", select: liu_pinyin }  # Ctrl+Alt+; 替代
    - { when: always, accept: "Control+slash", toggle: liu_w2c }             # Ctrl+/  → 查碼
    # 小狼毫預設選單中 ,／. 為翻頁；蝦米碼含這兩鍵（s.＝？、v.＝！、..＝：、.＝。）
    - { accept: comma, send: comma, when: has_menu }
    - { accept: comma, send: comma, when: paging }
    - { accept: period, send: period, when: has_menu }
    - { accept: period, send: period, when: paging }
    - { accept: "Control+period", toggle: simplification, when: always }    #進行簡繁切換
    - { accept: "Control+comma", toggle: extended_charset, when: always}
    - { accept: "Shift+space", toggle: full_shape, when: always}
    # 數字小鍵盤選字（從 0 開始，與主鍵盤一致）
    - { accept: KP_0, send: 0, when: has_menu }
    - { accept: KP_1, send: 1, when: has_menu }
    - { accept: KP_2, send: 2, when: has_menu }
    - { accept: KP_3, send: 3, when: has_menu }
    - { accept: KP_4, send: 4, when: has_menu }
    - { accept: KP_5, send: 5, when: has_menu }
    - { accept: KP_6, send: 6, when: has_menu }
    - { accept: KP_7, send: 7, when: has_menu }
    - { accept: KP_8, send: 8, when: has_menu }
    - { accept: KP_9, send: 9, when: has_menu }
    - { when: composing, accept: Control+k, send: Shift+Delete }
# }
