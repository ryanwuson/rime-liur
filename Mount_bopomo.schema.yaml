# Rime schema settings
# encoding: utf-8
# 《反查掛載專用 注音 設定頁》
schema:
  schema_id: Mount_bopomo
  name: "〔依賴方案〕注音詞庫"
  version: "202102-v2-p3.2"
  author:
    - Onion
  description: |
    注音／讀音反查掛載用（依賴用，非獨立輸入方案）
    字音資料源自洋蔥注音相關方案
  dependencies:
#    - tconly

switches:
  - name: ascii_mode
    reset: 0
    states: [ 中文, 英文 ]
  - name: full_shape
    reset: 0
    states: [ 半形, 全形 ]
  - name: ascii_punct #當鍵位被佔用，在大千注音鍵盤無法作用！
    reset: 0
    states: [ "。，", "．，" ]
  - name: simplification
    reset: 0
    states: [ 繁體, 简体 ]

engine:
  filters:
    - simplifier
    - uniquifier
  processors:
    - ascii_composer
    - recognizer
    - key_binder
    - speller
    - punctuator
    - selector
    - navigator
    - express_editor
#    - fluency_editor
  segmentors:
    - ascii_segmentor
    - matcher
    - abc_segmentor
    - punct_segmentor
    - fallback_segmentor
  translators:
#    - echo_translator
    - punct_translator
#    - reverse_lookup_translator
    - script_translator

menu:
  alternative_select_keys: "QAZWSX"
  page_size: 6

# v2-P0.1：prism 與 liu_bpmf 對齊
# delimiter 第一碼 ' = 自動分節顯示空白；第二碼 \ = 手動 ⁞
# 含剝聲調 abbrev + free_order；一聲＝空白
speller:
  alphabet: "1qaz2wsxedcrfv5tgbyhnujm8ik,9ol.0p;/-3467 "
  initials: "1qaz2wsxedcrfv5tgbyhnujm8ik,9ol.0p;/-"
  finals: " 6347"
  delimiter: "'\\"
  use_space: true
  algebra:
    - xform/[)(]//
    - xform/iu/iU/
    - xform/ui/uI/
    - xform/ong/ung/
    - xform/yi?/i/
    - xform/wu?/u/
    - xform/iu/v/
    - xform/([jqx])u/$1v/
    - xform/([iuv])n/$1en/
    - xform/zhi?/Z/
    - xform/chi?/C/
    - xform/shi?/S/
    - xform/([zcsr])i/$1/
    - xform/ai/A/
    - xform/ei/I/
    - xform/ao/O/
    - xform/ou/U/
    - xform/ang/K/
    - xform/eng/G/
    - xform/an/M/
    - xform/en/N/
    - xform/er/R/
    - xform/eh/E/
    - xform/([iv])e/$1E/
    # 頭碼須 derive（非 abbrev）：自動分節下 abbrev 不命中完整音節
    - derive/^([bpmfdtnlgkhjqxZCSrzcsiuvaoeEAIOUMNKGR]).+$/$1/
    - derive/^([A-Za-z]+)\d$/$1/
    - derive/^([bpmfdtnlgkhjqxZCSrzcsiuv])([iuvaoeEAIOUMNKG])\d$/$1$2/
    - derive/^([bpmfdtnlgkhjqxZCSrzcs])([iuv])([aoeEAIOUMNKG])\d$/$1$2$3/
    - derive/^([bpmfdtnlgkhjqx]).+(\d)$/$1$2/
    - derive/^([bpmfdtnlgkhjqxZCSrzcs])([iuv])/$2$1/
    - derive/^([iuv])([aoeEAIOUMNKG])/$2$1/
    - derive/^([bpmfdtnlgkhjqxZCSrzcs])([aoeEAIOUMNKG])/$2$1/
    - derive/^([bpmfdtnlgkhjqxZCSrzcs])([iuv])([aoeEAIOUMNKG])/$3$2$1/
    - derive/^([bpmfdtnlgkhjqxZCSrzcs])([iuv])([aoeEAIOUMNKG])/$3$1$2/
    - derive/^([bpmfdtnlgkhjqxZCSrzcs])([iuv])([aoeEAIOUMNKG])/$2$3$1/
    - derive/^([bpmfdtnlgkhjqxZCSrzcs])([iuv])([aoeEAIOUMNKG])/$1$3$2/
    - 'xlit|bpmfdtnlgkhjqxZCSrzcsiuvaoeEAIOUMNKGR12345|1qaz2wsxedcrfv5tgbyhnujm8ik,9ol.0p;/- 6347|'
    # P0.2：xlit 後剝聲調（含一聲空白），無聲調才能出候選
    - "derive/^(.+)[ 6347]$/$1/"

translator:
  dictionary: Mount_bopomo.extended
#  prism: Mount_bopomo #開啟反查須用 prism 標註調用此棱鏡文件名
  enable_user_dict: true
  enable_completion: false
  # P3：與 liu_bpmf lookup 一致；script_translator 預設 true（洋蔥未關）
  enable_sentence: true
  enable_encoder: false #是否開啓自動造詞
  encode_commit_history: false #是否對 已上屛詞 自動成詞
#  spelling_hints: 5 #～字以內候選標註完整帶調拼音
#  enable_charset_filter: true #是否開啓字符集過濾
  preedit_format:
    - "xlit|1qaz2wsxedcrfv5tgbyhnujm8ik,9ol.0p;/- 6347'|ㄅㄆㄇㄈㄉㄊㄋㄌㄍㄎㄏㄐㄑㄒㄓㄔㄕㄖㄗㄘㄙㄧㄨㄩㄚㄛㄜㄝㄞㄟㄠㄡㄢㄣㄤㄥㄦˉˊˇˋ˙ |"
    - 'xform/\\/⁞/'
  comment_format:
    - "xlit|1qaz2wsxedcrfv5tgbyhnujm8ik,9ol.0p;/- 6347'|ㄅㄆㄇㄈㄉㄊㄋㄌㄍㄎㄏㄐㄑㄒㄓㄔㄕㄖㄗㄘㄙㄧㄨㄩㄚㄛㄜㄝㄞㄟㄠㄡㄢㄣㄤㄥㄦˉˊˇˋ˙ |"
    - 'xform/\\/⁞/'

